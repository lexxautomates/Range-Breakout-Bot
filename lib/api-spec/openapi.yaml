openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Opening Range Breakout (ORB) Trading Bot API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: bot
    description: Bot control operations (legacy single-bot)
  - name: bots
    description: Multi-bot swarm operations
  - name: scanner
    description: Morning gap scanner
  - name: session
    description: Current trading session
  - name: trades
    description: Trade history
  - name: config
    description: Bot configuration
  - name: account
    description: Alpaca account info

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /bot/status:
    get:
      operationId: getBotStatus
      tags: [bot]
      summary: Get current bot status
      responses:
        "200":
          description: Bot status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotStatus"

  /bot/start:
    post:
      operationId: startBot
      tags: [bot]
      summary: Start the trading bot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartBotBody"
      responses:
        "200":
          description: Bot started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotStatus"

  /bot/stop:
    post:
      operationId: stopBot
      tags: [bot]
      summary: Stop the trading bot
      responses:
        "200":
          description: Bot stopped
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotStatus"

  /bots:
    get:
      operationId: listBots
      tags: [bots]
      summary: List all running child bots
      responses:
        "200":
          description: List of child bots
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChildBot"
    post:
      operationId: createBot
      tags: [bots]
      summary: Start a new child bot for a single symbol
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBotBody"
      responses:
        "200":
          description: Child bot started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChildBot"
    delete:
      operationId: stopAllBots
      tags: [bots]
      summary: Stop all running child bots
      responses:
        "200":
          description: All bots stopped
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"

  /bots/start:
    post:
      operationId: startBots
      tags: [bots]
      summary: Batch start bots for a watchlist of symbols
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartBotsBody"
      responses:
        "200":
          description: Batch start result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StartBotsResult"

  /bots/{id}:
    get:
      operationId: getBot
      tags: [bots]
      summary: Get a single child bot by id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Child bot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChildBot"
        "404":
          description: Not found
    delete:
      operationId: stopBot2
      tags: [bots]
      summary: Stop a single child bot
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Bot stopped
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "404":
          description: Not found

  /bots/{id}/config:
    get:
      operationId: getBotConfig
      tags: [bots]
      summary: Get the evolved parameter config for a specific child bot
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Bot config snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotConfigSnapshot"
        "404":
          description: Not found

  /bots/{id}/offspring:
    post:
      operationId: spawnOffspring
      tags: [bots]
      summary: Spawn an evolved offspring of a child bot
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Offspring bot started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChildBot"
        "404":
          description: Parent bot not found

  /scanner/results:
    get:
      operationId: getScanResults
      tags: [scanner]
      summary: Get the latest cached scanner results
      responses:
        "200":
          description: Scan results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanResult"

  /scanner/candidates:
    get:
      operationId: getScanCandidates
      tags: [scanner]
      summary: Get just the candidates list from the latest scan (flat array)
      responses:
        "200":
          description: Scan candidates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ScanCandidate"

  /scanner/run:
    post:
      operationId: runScan
      tags: [scanner]
      summary: Trigger a manual gap scan
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScanRequest"
      responses:
        "200":
          description: Scan results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanResult"

  /scanner/auto-start:
    post:
      operationId: autoStartBots
      tags: [scanner]
      summary: Run scan and auto-start top N bots
      responses:
        "200":
          description: Auto-start result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutoStartResult"

  /session/current:
    get:
      operationId: getCurrentSession
      tags: [session]
      summary: Get current trading session state
      responses:
        "200":
          description: Current session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionState"

  /session/summary:
    get:
      operationId: getSessionSummary
      tags: [session]
      summary: Get today's session summary (P&L, wins, losses)
      responses:
        "200":
          description: Session summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionSummary"

  /trades:
    get:
      operationId: listTrades
      tags: [trades]
      summary: List all historical trades
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: Trade list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TradeList"

  /trades/stats:
    get:
      operationId: getTradeStats
      tags: [trades]
      summary: Aggregate stats across all trades (win rate, avg R, total P&L)
      responses:
        "200":
          description: Trade stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TradeStats"

  /config:
    get:
      operationId: getConfig
      tags: [config]
      summary: Get current bot configuration
      responses:
        "200":
          description: Configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotConfig"
    put:
      operationId: updateConfig
      tags: [config]
      summary: Update bot configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BotConfigBody"
      responses:
        "200":
          description: Updated configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotConfig"

  /account:
    get:
      operationId: getAccount
      tags: [account]
      summary: Get Alpaca account info (equity, cash, buying power)
      responses:
        "200":
          description: Account info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountInfo"

  /account/positions:
    get:
      operationId: getPositions
      tags: [account]
      summary: Get current open positions from Alpaca
      responses:
        "200":
          description: Open positions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Position"

components:
  schemas:
    OkResponse:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean

    StartBotsBody:
      type: object
      required: [symbols]
      properties:
        symbols:
          type: array
          items:
            type: string
        config:
          $ref: "#/components/schemas/ChildBotConfigOverride"

    StartBotsResult:
      type: object
      required: [started, errors]
      properties:
        started:
          type: array
          items:
            $ref: "#/components/schemas/ChildBot"
        errors:
          type: array
          items:
            type: object
            required: [symbol, error]
            properties:
              symbol:
                type: string
              error:
                type: string

    BotConfigSnapshot:
      type: object
      required: [botId, generation, config]
      properties:
        botId:
          type: string
        generation:
          type: integer
        config:
          $ref: "#/components/schemas/ChildBotConfig"

    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    BotStatus:
      type: object
      required: [running, symbol, phase, startedAt]
      properties:
        running:
          type: boolean
        symbol:
          type: string
        phase:
          type: string
          enum: [idle, waiting_open, building_range, watching, in_trade, closed]
        startedAt:
          type: string
          nullable: true
        stoppedAt:
          type: string
          nullable: true
        lastUpdated:
          type: string
          nullable: true
        error:
          type: string
          nullable: true

    StartBotBody:
      type: object
      required: [symbol]
      properties:
        symbol:
          type: string

    CreateBotBody:
      type: object
      required: [symbol]
      properties:
        symbol:
          type: string
        config:
          $ref: "#/components/schemas/ChildBotConfigOverride"

    ChildBotConfigOverride:
      type: object
      properties:
        openingRangeMinutes:
          type: integer
        riskPercent:
          type: number
        rewardRiskRatio:
          type: number
        requireVolumeConfirmation:
          type: boolean
        volumeMultiplier:
          type: number
        trailingStopEnabled:
          type: boolean
        trailingStopActivationR:
          type: number
        reEntryEnabled:
          type: boolean
        maxOrbWidthPercent:
          type: number
        minOrbWidthPercent:
          type: number
        breakoutWindowMinutes:
          type: integer
        useModerateRisk:
          type: boolean

    ChildBotConfig:
      type: object
      required: [openingRangeMinutes, riskPercent, rewardRiskRatio, requireVolumeConfirmation, volumeMultiplier, trailingStopEnabled, trailingStopActivationR, reEntryEnabled, maxOrbWidthPercent, minOrbWidthPercent, breakoutWindowMinutes, useModerateRisk]
      properties:
        openingRangeMinutes:
          type: integer
        riskPercent:
          type: number
        rewardRiskRatio:
          type: number
        requireVolumeConfirmation:
          type: boolean
        volumeMultiplier:
          type: number
        trailingStopEnabled:
          type: boolean
        trailingStopActivationR:
          type: number
        reEntryEnabled:
          type: boolean
        maxOrbWidthPercent:
          type: number
        minOrbWidthPercent:
          type: number
        breakoutWindowMinutes:
          type: integer
        useModerateRisk:
          type: boolean

    BotStats:
      type: object
      required: [totalTrades, wins, losses, totalPnl, avgRMultiple, winRate]
      properties:
        totalTrades:
          type: integer
        wins:
          type: integer
        losses:
          type: integer
        totalPnl:
          type: number
        avgRMultiple:
          type: number
        winRate:
          type: number

    ChildBot:
      type: object
      required: [id, symbol, generation, config, phase, session, startedAt, stats]
      properties:
        id:
          type: string
        dbId:
          type: integer
          nullable: true
        symbol:
          type: string
        generation:
          type: integer
        parentId:
          type: string
          nullable: true
        config:
          $ref: "#/components/schemas/ChildBotConfig"
        phase:
          type: string
          enum: [idle, waiting_open, building_range, watching, in_trade, closed]
        session:
          $ref: "#/components/schemas/SessionState"
        startedAt:
          type: string
        stoppedAt:
          type: string
          nullable: true
        lastUpdated:
          type: string
          nullable: true
        error:
          type: string
          nullable: true
        stats:
          $ref: "#/components/schemas/BotStats"

    ScanCandidate:
      type: object
      required: [symbol, prevClose, open, currentPrice, gapPercent, gapDirection, volume, avgVolume, relativeVolume, score, recommended]
      properties:
        symbol:
          type: string
        prevClose:
          type: number
        open:
          type: number
        currentPrice:
          type: number
        gapPercent:
          type: number
        gapDirection:
          type: string
          enum: [up, down]
        volume:
          type: number
        avgVolume:
          type: number
        relativeVolume:
          type: number
        score:
          type: number
          description: Combined ranking score (absGapPercent * relativeVolume) — higher is better
        recommended:
          type: boolean

    ScanResult:
      type: object
      required: [scannedAt, candidates, topN]
      properties:
        scannedAt:
          type: string
          nullable: true
        candidates:
          type: array
          items:
            $ref: "#/components/schemas/ScanCandidate"
        topN:
          type: array
          items:
            $ref: "#/components/schemas/ScanCandidate"

    ScanRequest:
      type: object
      properties:
        symbols:
          type: array
          items:
            type: string
        topN:
          type: integer
          default: 10
        minGapPercent:
          type: number
          default: 0.5
        minRelativeVolume:
          type: number
          default: 1.0

    AutoStartResult:
      type: object
      required: [ok, topN]
      properties:
        ok:
          type: boolean
        scannedAt:
          type: string
          nullable: true
        topN:
          type: array
          items:
            $ref: "#/components/schemas/ScanCandidate"

    SessionState:
      type: object
      required: [symbol, phase, date]
      properties:
        symbol:
          type: string
        phase:
          type: string
          enum: [idle, waiting_open, building_range, watching, in_trade, closed]
        date:
          type: string
        orbHigh:
          type: number
          nullable: true
        orbLow:
          type: number
          nullable: true
        orbWidth:
          type: number
          nullable: true
        currentPrice:
          type: number
          nullable: true
        volume:
          type: number
          nullable: true
        averageVolume:
          type: number
          nullable: true
        volumeRatio:
          type: number
          nullable: true
        openRangeStart:
          type: string
          nullable: true
        openRangeEnd:
          type: string
          nullable: true
        breakoutDirection:
          type: string
          enum: [long, short, none]
          nullable: true
        entryPrice:
          type: number
          nullable: true
        stopPrice:
          type: number
          nullable: true
        targetPrice:
          type: number
          nullable: true
        currentPnl:
          type: number
          nullable: true
        longTradeUsed:
          type: boolean
        shortTradeUsed:
          type: boolean
        qty:
          type: number
          nullable: true

    SessionSummary:
      type: object
      required: [date, totalTrades, wins, losses, totalPnl, winRate]
      properties:
        date:
          type: string
        totalTrades:
          type: integer
        wins:
          type: integer
        losses:
          type: integer
        totalPnl:
          type: number
        winRate:
          type: number
        bestTrade:
          type: number
          nullable: true
        worstTrade:
          type: number
          nullable: true

    Trade:
      type: object
      required: [id, symbol, direction, entryPrice, exitPrice, qty, pnl, outcome, entryTime, exitTime, stopPrice, targetPrice, rMultiple]
      properties:
        id:
          type: integer
        symbol:
          type: string
        botInstanceId:
          type: integer
          nullable: true
        direction:
          type: string
          enum: [long, short]
        entryPrice:
          type: number
        exitPrice:
          type: number
        stopPrice:
          type: number
        targetPrice:
          type: number
        qty:
          type: integer
        pnl:
          type: number
        rMultiple:
          type: number
        outcome:
          type: string
          enum: [win, loss, breakeven]
        entryTime:
          type: string
        exitTime:
          type: string
        exitReason:
          type: string
          nullable: true
        orbHigh:
          type: number
          nullable: true
        orbLow:
          type: number
          nullable: true
        volumeRatio:
          type: number
          nullable: true

    TradeList:
      type: object
      required: [trades, total]
      properties:
        trades:
          type: array
          items:
            $ref: "#/components/schemas/Trade"
        total:
          type: integer

    TradeStats:
      type: object
      required: [totalTrades, wins, losses, winRate, totalPnl, avgPnlPerTrade, avgRMultiple, bestTrade, worstTrade, avgWin, avgLoss, profitFactor]
      properties:
        totalTrades:
          type: integer
        wins:
          type: integer
        losses:
          type: integer
        winRate:
          type: number
        totalPnl:
          type: number
        avgPnlPerTrade:
          type: number
        avgRMultiple:
          type: number
        bestTrade:
          type: number
        worstTrade:
          type: number
        avgWin:
          type: number
        avgLoss:
          type: number
        profitFactor:
          type: number

    BotConfig:
      type: object
      required: [id, openingRangeMinutes, riskPercent, rewardRiskRatio, requireVolumeConfirmation, volumeMultiplier, trailingStopEnabled, trailingStopActivationR, reEntryEnabled, maxOrbWidthPercent, minOrbWidthPercent, breakoutWindowMinutes, useModerateRisk, evolutionThreshold, autoStartTopN, updatedAt]
      properties:
        id:
          type: integer
        openingRangeMinutes:
          type: integer
          description: Minutes after open to define opening range (default 15)
        riskPercent:
          type: number
          description: Max risk per trade as % of account equity (e.g. 1.0 = 1%)
        rewardRiskRatio:
          type: number
          description: Target profit as multiple of risk (e.g. 2.0 = 2R)
        requireVolumeConfirmation:
          type: boolean
          description: Require above-average volume for breakout confirmation
        volumeMultiplier:
          type: number
          description: Volume must be X times average to confirm (e.g. 1.5)
        trailingStopEnabled:
          type: boolean
          description: Enable trailing stop after 1R profit
        trailingStopActivationR:
          type: number
          description: R-multiple at which trailing stop activates (default 1.0)
        reEntryEnabled:
          type: boolean
          description: Allow re-entry after stopped out
        maxOrbWidthPercent:
          type: number
          description: Skip trade if ORB width > this % of price
        minOrbWidthPercent:
          type: number
          description: Skip trade if ORB width < this % of price
        breakoutWindowMinutes:
          type: integer
          description: Minutes after ORB window closes to allow breakout entries
        useModerateRisk:
          type: boolean
          description: Use midpoint as stop instead of opposite side of range
        evolutionThreshold:
          type: integer
          description: Number of trades after which a bot evolves its parameters
        autoStartTopN:
          type: integer
          description: Number of top gap-scan candidates to auto-start each morning (0 = disabled)
        updatedAt:
          type: string

    BotConfigBody:
      type: object
      properties:
        openingRangeMinutes:
          type: integer
        riskPercent:
          type: number
        rewardRiskRatio:
          type: number
        requireVolumeConfirmation:
          type: boolean
        volumeMultiplier:
          type: number
        trailingStopEnabled:
          type: boolean
        trailingStopActivationR:
          type: number
        reEntryEnabled:
          type: boolean
        maxOrbWidthPercent:
          type: number
        minOrbWidthPercent:
          type: number
        breakoutWindowMinutes:
          type: integer
        useModerateRisk:
          type: boolean
        evolutionThreshold:
          type: integer
        autoStartTopN:
          type: integer

    AccountInfo:
      type: object
      required: [equity, cash, buyingPower, portfolioValue, daytradeCount, patternDayTrader]
      properties:
        equity:
          type: number
        cash:
          type: number
        buyingPower:
          type: number
        portfolioValue:
          type: number
        daytradeCount:
          type: integer
        patternDayTrader:
          type: boolean
        unrealizedPnl:
          type: number
          nullable: true
        realizedPnl:
          type: number
          nullable: true

    Position:
      type: object
      required: [symbol, qty, side, entryPrice, currentPrice, marketValue, unrealizedPnl, unrealizedPnlPercent]
      properties:
        symbol:
          type: string
        qty:
          type: number
        side:
          type: string
          enum: [long, short]
        entryPrice:
          type: number
        currentPrice:
          type: number
        marketValue:
          type: number
        unrealizedPnl:
          type: number
        unrealizedPnlPercent:
          type: number
